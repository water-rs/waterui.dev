<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }
      @font-face {
        font-family: 'Geist Variable';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0f1112;
        color: #ecece6;
        font-family: 'Geist Variable', system-ui, sans-serif;
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(236, 236, 230, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(236, 236, 230, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }
      svg {
        width: 264px;
        height: auto;
        color: #ecece6;
      }
      h1 {
        margin: 40px 0 0;
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      h1 span {
        color: #3fb8c4;
      }
      p {
        margin: 24px 0 0;
        font-size: 26px;
        color: #a3a39b;
      }
      .tag {
        position: absolute;
        right: 96px;
        bottom: 64px;
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 22px;
        color: #6d6d66;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="content">
      <svg viewBox="12 66 176 68" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M46 80 L18 100 L46 120" />
          <path d="M154 80 L182 100 L154 120" />
          <path d="M67 74 L62 126" />
          <path d="M80 74 L75 126" />
          <path d="M56.5 90 L87.5 90" />
          <path d="M54.5 110 L85.5 110" />
          <path d="M125 74 L120 126" />
          <path d="M138 74 L133 126" />
          <path d="M114.5 90 L145.5 90" />
          <path d="M112.5 110 L143.5 110" />
          <path d="M93 100 L107 100" />
        </g>
      </svg>
      <h1>Write once, <span>apply everywhere.</span></h1>
      <p>Cross-platform UI framework for Rust.</p>
    </div>
    <div class="tag">waterui.dev</div>
  </body>
</html>
